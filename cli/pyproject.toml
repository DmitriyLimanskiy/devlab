[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stack-forge-cli"
version = "0.1.0"
description = "Выбор папки проекта Stack Forge"
requires-python = ">=3.11"

[project.scripts]
stackforge = "stack_forge.main:main"

[tool.setuptools]
packages = ["stack_forge", "stack_forge.api"]
package-dir = {stack_forge = "src"}
