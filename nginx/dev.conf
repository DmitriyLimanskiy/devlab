resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream devlab_backend {
    zone devlab_backend 64k;
    server backend:8000 resolve;
}

upstream devlab_frontend {
    zone devlab_frontend 64k;
    server frontend:5173 resolve;
}

server {
    listen 80;
    server_name _;

    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://devlab_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://devlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location / {
        proxy_pass http://devlab_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
