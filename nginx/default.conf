resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

upstream stack_forge_backend {
    zone stack_forge_backend 64k;
    server backend:8000 resolve;
}

upstream stack_forge_frontend {
    zone stack_forge_frontend 64k;
    server frontend:5173 resolve;
}

server {
    listen 80;
    server_name _;
    root /srv/stack-forge;
    index index.html;

    location = /api { return 308 /api/; }
    location /api/ {
        proxy_pass http://stack_forge_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /ws/ {
        proxy_pass http://stack_forge_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }
    location /assets/ {
        try_files $uri @frontend;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location / {
        try_files $uri /index.html @frontend;
        add_header Cache-Control "no-cache";
    }
    location @frontend {
        if (-f $document_root/index.html) { return 404; }
        proxy_pass http://stack_forge_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
